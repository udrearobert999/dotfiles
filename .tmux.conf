set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind x kill-pane

unbind r
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5

bind -r m resize-pane -Z

set -sg escape-time 0

set -g mouse on
set -g history-limit 100000
set -g set-clipboard on
setw -g mode-keys vi

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g default-terminal "tmux-256color"
set -g focus-events on

set -as terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:usstyle:overline"

set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"

bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -n M-h if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 3'

bind-key -n 'M-\' split-window -h -c "#{pane_current_path}"
bind-key -n 'M--' split-window -v -c "#{pane_current_path}"

bind-key Enter copy-mode
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi v send-keys -X begin-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

set -g @plugin tmux-plugins/tpm

set -g @plugin tmux-plugins/tmux-resurrect
set -g @plugin tmux-plugins/tmux-continuum

set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @catppuccin_flavor 'latte'
source-file ~/.config/tmux/gruvbox-light.conf
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #{s|^#{HOME}|~|:pane_current_path}'
set -g @catppuccin_window_current_text ' #{s|^#{HOME}|~|:pane_current_path}'
set -g @catppuccin_ram_text ' #{l:#(~/.config/tmux/ram.sh)}'

set -g @plugin tmux-plugins/tmux-cpu
set -g @plugin tmux-plugins/tmux-battery

set -g @plugin tmux-plugins/tmux-yank
set -g @plugin tmux-plugins/tmux-copycat

set -g @resurrect-capture-pane-contents on
set -g @continuum-restore on

run ~/.tmux/plugins/tpm/tpm

set -g status-left-length 100
set -g status-right-length 100

set -g status-left ""
set -g status-right ""
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#{E:@thm_green}]● ,  }#{pane_index}: #{pane_current_command}"

run-shell ~/.tmux/plugins/tmux-cpu/cpu.tmux
run-shell ~/.tmux/plugins/tmux-battery/battery.tmux
